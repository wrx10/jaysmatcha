    <script>
      // Gracefully prevent preview iframe HMR WebSocket disconnect rejections from breaking the app
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.join(' ');
          if (str.indexOf('[vite]') !== -1 && (str.indexOf('websocket') !== -1 || str.indexOf('WebSocket') !== -1)) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1 || msg.indexOf('wss:') !== -1) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function (event) {
          var msg = (event.message || '') + ' ' + (event.filename || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
